html<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a0c">
<title>Shot Caller</title>

<style>
:root{
  --bg:#070a0c;
  --panel:#11171a;
  --panel2:#0b1013;
  --line:rgba(255,255,255,.075);
  --text:#f5f7f8;
  --muted:#89949b;
  --lime:#d9ff3f;
  --red:#ff4652;
  --green:#42d995;
  --cyan:#45d9ff;
  --bank:#ff9f43;
  --white:#f5f7f8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
  overflow-y:auto;
  background:
    radial-gradient(
      circle at 50% -10%,
      #26343a 0,
      #11191d 35%,
      #07090b 78%
    );
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body{
  padding:7px;
}

button{
  font:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

.app{
  width:min(1200px,100%);
  margin:auto;
}

.header{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.table-hint{
  margin-top:9px;
  padding:9px 5px 1px;
  border-top:1px solid rgba(255,255,255,.055);
  width:100%;
  transform:none;
  color:var(--muted);
  font-size:9px;
  line-height:1.35;
  letter-spacing:.01em;
  text-align:left;
}

.table-hint strong{
  display:block;
  margin-bottom:2px;
  color:var(--text);
  font-weight:800;
}

.table-hint-line{
  display:block;
  white-space:normal;
}

.table-lock-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 8px;
  padding:0 5px 8px;
  border-bottom:1px solid rgba(255,255,255,.055);
}

.table-lock-copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}

.table-lock-status{
  color:#e3e8ea;
  font-size:10px;
  font-weight:900;
}

.table-lock-help{
  color:var(--muted);
  font-size:9px;
  line-height:1.25;
}

.table-lock.active{
  background:var(--lime);
  border-color:var(--lime);
  color:#10150b;
  box-shadow:
    0 0 0 1px rgba(217,255,63,.15),
    0 2px 7px rgba(217,255,63,.12);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.brand-name{
  font-size:24px;
  font-weight:900;
  letter-spacing:.015em;
  line-height:1;
}

.reset{
  border:1px solid var(--line);
  background:#141a1e;
  color:#e9edef;
  border-radius:9px;
  min-width:54px;
  min-height:30px;
  padding:5px 12px;
  font-size:10px;
  font-weight:850;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(330px,.72fr);
  gap:9px;
}

.card{
  background:rgba(17,23,26,.98);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:0 18px 45px rgba(0,0,0,.25);
}

.table-card{
  padding:9px;
  min-width:0;
  overflow:hidden;
}

.table-stage{
  width:100%;
  aspect-ratio:59/109;
  position:relative;
  max-width:100%;
  margin:0 auto;
  overflow:hidden;
  border-radius:10px;
}

#table{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:pan-y;
}

.side{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.full-card{
  width:100%;
}

.section{
  padding:13px 14px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:23px;
  gap:10px;
}

.section-title{
  font-size:13px;
  font-weight:950;
  letter-spacing:-.02em;
}

.subsection-title{
  margin-top:12px;
  margin-bottom:6px;
  color:#dce3e6;
  font-size:11px;
  font-weight:900;
  letter-spacing:-.01em;
}

.section-accent{
  color:var(--lime);
  font-size:10px;
  font-weight:950;
  letter-spacing:.01em;
}

.section-action{
  appearance:none;
  -webkit-appearance:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:54px;
  min-height:30px;
  padding:5px 12px;
  border:1px solid rgba(255,255,255,.18);
  background:#171e22;
  color:#dce3e6;
  border-radius:8px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 1px 2px rgba(0,0,0,.3);
  font-size:10px;
  font-weight:950;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.section-action:hover{
  background:#222b30;
  border-color:rgba(255,255,255,.28);
}

.section-action:active{
  transform:translateY(1px);
}

.section-action.active{
  background:var(--lime);
  border-color:var(--lime);
  color:#10150b;
  box-shadow:
    0 0 0 1px rgba(217,255,63,.15),
    0 2px 7px rgba(217,255,63,.12);
}

.section-action:disabled{
  opacity:.38;
  cursor:not-allowed;
  background:#11171a;
  border-color:rgba(255,255,255,.10);
  color:#7d888e;
  box-shadow:none;
}

.section-action:disabled:hover{
  background:#11171a;
  border-color:rgba(255,255,255,.10);
}

.where-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

.where-grid.combo{
  grid-template-columns:repeat(3,1fr);
}

.ball-panel{
  background:#0a0e10;
  border:1px solid rgba(255,255,255,.055);
  border-radius:11px;
  padding:8px;
  min-width:0;
}

.ball-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}

.ball-label{
  color:#aeb7bd;
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
}

.ball-view{
  width:100%;
  aspect-ratio:1;
  display:block;
}

.combo-only{
  display:none;
}

.where-grid.combo .combo-only{
  display:block;
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:9px;
}

.stat{
  min-width:0;
  background:#0b1013;
  border:1px solid rgba(255,255,255,.055);
  border-radius:9px;
  padding:9px;
}

.stat-label{
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
}

.stat-value{
  margin-top:4px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.pro-instruction{
  margin-top:9px;
  padding:9px 11px;
  border-left:3px solid var(--lime);
  background:#0b1013;
  border-radius:0 9px 9px 0;
  color:#e3e8ea;
  font-size:11px;
  line-height:1.25;
  font-weight:800;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.call-line{
  display:flex;
  align-items:baseline;
  gap:8px;
}

.call-step{
  flex:0 0 auto;
  min-width:48px;
  font-size:9px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:#7d888e;
  font-weight:900;
}

.call-text{
  flex:1;
}

.call-line.scratch-warning{
  color:#ffd4d7;
}

.call-line.scratch-warning .call-step{
  color:var(--red);
}

.pro-instruction .highlight{
  color:#f5f7f8;
  font-weight:950;
}

.pro-instruction .neutral-emphasis{
  color:#ffffff;
  font-weight:900;
}

.pockets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px;
}

.pocket{
  min-height:38px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.08);
  background:#101519;
  color:#b8c1c6;
  font-size:10px;
  font-weight:850;
}

.pocket.selected{
  background:rgba(217,255,63,.10);
  border-color:var(--lime);
  color:var(--lime);
}

.shot-type-section{
  border-top:1px solid rgba(255,255,255,.055);
  margin-top:14px;
  padding-top:13px;
}

.modes{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  margin-top:9px;
}

.mode{
  flex:0 0 calc(33.333% - 4px);
  border:1px solid rgba(255,255,255,.09);
  background:#101519;
  color:#b8c1c6;
  border-radius:9px;
  min-height:38px;
  padding:8px 4px;
  font-size:10px;
  font-weight:900;
}

.mode.active{
  background:var(--lime);
  color:#10150b;
  border-color:var(--lime);
}

.mode.suggested:not(.active){
  color:var(--lime);
  border-color:rgba(217,255,63,.46);
  background:rgba(217,255,63,.06);
}

.rack{
  position:relative;
  margin:11px auto 3px;
  width:min(230px,78vw);
  aspect-ratio:1.58/1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.rack-row{
  display:flex;
  gap:3px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}

.rack-row.r1{top:1%}
.rack-row.r2{top:17%}
.rack-row.r3{top:33%}
.rack-row.r4{top:49%}
.rack-row.r5{top:65%}

.rack-ball{
  width:31px;
  height:31px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  position:relative;
  display:grid;
  place-items:center;
  padding:0;
  overflow:hidden;
  box-shadow:
    inset -3px -4px 5px rgba(0,0,0,.25),
    0 2px 4px rgba(0,0,0,.25);
  font-size:9px;
  font-weight:950;
  color:#111;
}

.rack-ball.stripe{
  background:
    linear-gradient(
      to bottom,
      var(--ball-color) 0 30%,
      #f4f4f4 30% 70%,
      var(--ball-color) 70% 100%
    );
}

.rack-ball.solid{
  background:var(--ball-color);
}

.rack-ball span{
  width:14px;
  height:14px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-size:7px;
  font-weight:950;
  border:1px solid rgba(0,0,0,.25);
}

.rack-ball.selected{
  outline:3px solid var(--lime);
  outline-offset:2px;
  z-index:2;
}

.rack-ball.on-table{
  opacity:.42;
}

.rack-ball.object-ball{
  opacity:1;
}

.rack-ball.my-ball{
  box-shadow:
    0 0 0 2px rgba(69,217,255,.65),
    inset -3px -4px 5px rgba(0,0,0,.25),
    0 2px 4px rgba(0,0,0,.25);
}

.rack-ball.opponent-ball{
  box-shadow:
    0 0 0 2px rgba(255,159,67,.65),
    inset -3px -4px 5px rgba(0,0,0,.25),
    0 2px 4px rgba(0,0,0,.25);
}

.ownership-section{
  border-top:1px solid rgba(255,255,255,.055);
  margin-top:14px;
  padding-top:13px;
}

.ownership-label{
  color:#89949b;
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
  margin-top:9px;
  margin-bottom:7px;
}

.ownership-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.ownership-button{
  appearance:none;
  -webkit-appearance:none;
  border:1px solid rgba(255,255,255,.09);
  background:#101519;
  color:#b8c1c6;
  border-radius:9px;
  min-height:40px;
  padding:8px 5px;
  font-size:10px;
  font-weight:900;
  text-align:center;
  transition:
    background .12s ease,
    border-color .12s ease,
    color .12s ease,
    transform .08s ease,
    box-shadow .12s ease;
}
