<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a0c">
<title>Shot Caller</title>
<style>
:root{
  --bg:#070a0c;
  --panel:#11171a;
  --panel2:#0b1013;
  --line:rgba(255,255,255,.075);
  --text:#f5f7f8;
  --muted:#89949b;
  --lime:#d9ff3f;
  --red:#ff4652;
  --green:#42d995;
  --bank:#ff9f43;
  --white:#f5f7f8;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,#26343a 0,#11191d 35%,#07090b 78%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
body{padding:7px}
button{
  font:inherit;
  cursor:pointer;
  touch-action:manipulation;
}
.app{
  width:min(1200px,100%);
  margin:auto;
}
.header{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
}
.brand-name{
  font-size:22px;
  font-weight:950;
  letter-spacing:-.06em;
  line-height:.9;
}
.reset{
  border:1px solid var(--line);
  background:#141a1e;
  color:#e9edef;
  border-radius:9px;
  padding:8px 13px;
  font-size:12px;
  font-weight:850;
}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(330px,.72fr);
  gap:9px;
}
.card{
  background:rgba(17,23,26,.98);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:0 18px 45px rgba(0,0,0,.25);
}
.table-card{
  padding:9px;
  min-width:0;
}
.table-stage{
  width:100%;
  aspect-ratio:2/1;
  position:relative;
}
#table{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}
.delete-overlay{
  position:absolute;
  display:none;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  padding:0;
  border:0;
  background:transparent;
  color:#ffffff;
  font-size:17px;
  line-height:1;
  font-weight:900;
  text-shadow:
    0 1px 3px rgba(0,0,0,.95),
    0 0 4px rgba(0,0,0,.9);
  z-index:20;
  transform:translate(-50%,-50%);
  touch-action:manipulation;
}
.delete-overlay.visible{
  display:flex;
}
.delete-overlay:hover{
  color:var(--red);
  transform:translate(-50%,-50%) scale(1.08);
}
.delete-overlay:active{
  color:var(--red);
  transform:translate(-50%,-50%) scale(.94);
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 15px;
  padding:8px 2px 1px;
  font-size:10px;
  font-weight:800;
  color:#aeb7bd;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
}
.legend-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  flex:0 0 auto;
}
.legend-green .legend-dot{background:var(--green)}
.legend-white .legend-dot{background:#fff}
.legend-red .legend-dot{background:var(--bank)}
.side{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.full-card{
  width:100%;
}
.section{
  padding:13px 14px;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:23px;
  gap:10px;
}
.section-title{
  font-size:13px;
  font-weight:950;
  letter-spacing:-.02em;
}
.section-accent{
  color:var(--lime);
  font-size:10px;
  font-weight:950;
  letter-spacing:.01em;
}
.section-action{
  appearance:none;
  -webkit-appearance:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:54px;
  min-height:30px;
  padding:5px 12px;
  border:1px solid rgba(255,255,255,.18);
  background:#171e22;
  color:#dce3e6;
  border-radius:8px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 1px 2px rgba(0,0,0,.3);
  font-size:10px;
  font-weight:950;
  letter-spacing:.04em;
  text-transform:uppercase;
  transition:
    background .12s ease,
    border-color .12s ease,
    color .12s ease,
    transform .08s ease;
}
.section-action:hover{
  background:#222b30;
  border-color:rgba(255,255,255,.28);
}
.section-action:active{
  transform:translateY(1px);
}
.section-action.active{
  background:var(--lime);
  border-color:var(--lime);
  color:#10150b;
  box-shadow:
    0 0 0 1px rgba(217,255,63,.15),
    0 2px 7px rgba(217,255,63,.12);
}
.where-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}
.where-grid.combo{
  grid-template-columns:repeat(3,1fr);
}
.ball-panel{
  background:#0a0e10;
  border:1px solid rgba(255,255,255,.055);
  border-radius:11px;
  padding:8px;
  min-width:0;
}
.ball-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}
.ball-label{
  color:#aeb7bd;
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
}
.ball-view{
  width:100%;
  aspect-ratio:1;
  display:block;
}
.combo-only{
  display:none;
}
.where-grid.combo .combo-only{
  display:block;
}
.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:9px;
}
.stat{
  min-width:0;
  background:#0b1013;
  border:1px solid rgba(255,255,255,.055);
  border-radius:9px;
  padding:9px;
}
.stat-label{
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
}
.stat-value{
  margin-top:4px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pro-instruction{
  margin-top:9px;
  padding:12px 13px;
  border-left:3px solid var(--lime);
  background:#0b1013;
  border-radius:0 9px 9px 0;
  color:#e3e8ea;
  font-size:11px;
  line-height:1.6;
  font-weight:700;
}
.pro-instruction .highlight{
  color:var(--lime);
  font-weight:950;
}
.pro-instruction .neutral-emphasis{
  color:#ffffff;
  font-weight:900;
}
.pockets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px;
}
.pocket{
  min-height:38px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.08);
  background:#101519;
  color:#b8c1c6;
  font-size:10px;
  font-weight:850;
}
.pocket.selected{
  background:rgba(217,255,63,.10);
  border-color:var(--lime);
  color:var(--lime);
}
.shot-type-section{
  border-top:1px solid rgba(255,255,255,.055);
  margin-top:14px;
  padding-top:13px;
}
.modes{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:9px;
}
.mode{
  border:1px solid rgba(255,255,255,.09);
  background:#101519;
  color:#b8c1c6;
  border-radius:9px;
  min-height:38px;
  padding:8px 4px;
  font-size:10px;
  font-weight:900;
}
.mode.active{
  background:var(--lime);
  color:#10150b;
  border-color:var(--lime);
}
.ball-roll-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px;
}
.ball-roll-option{
  appearance:none;
  -webkit-appearance:none;
  border:1px solid rgba(255,255,255,.09);
  background:#101519;
  color:#b8c1c6;
  border-radius:9px;
  min-height:40px;
  padding:8px 5px;
  font-size:10px;
  font-weight:900;
  text-align:center;
  transition:
    background .12s ease,
    border-color .12s ease,
    color .12s ease,
    transform .08s ease,
    box-shadow .12s ease;
  user-select:none;
  -webkit-user-select:none;
}
.ball-roll-option:hover{
  background:#182024;
  border-color:rgba(255,255,255,.2);
}
.ball-roll-option:active{
  transform:translateY(1px);
}
.ball-roll-option.active{
  background:var(--lime);
  color:#10150b;
  border-color:var(--lime);
  box-shadow:
    0 0 0 1px rgba(217,255,63,.15),
    0 2px 7px rgba(217,255,63,.12);
}
.rack{
  position:relative;
  margin:11px auto 3px;
  width:min(230px,78vw);
  aspect-ratio:1.58/1;
  display:flex;
  align-items:center;
  justify-content:center;
}
.rack-row{
  display:flex;
  gap:3px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}
.rack-row.r1{top:1%}
.rack-row.r2{top:17%}
.rack-row.r3{top:33%}
.rack-row.r4{top:49%}
.rack-row.r5{top:65%}
.rack-ball{
  width:31px;
  height:31px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  position:relative;
  display:grid;
  place-items:center;
  padding:0;
  overflow:hidden;
  box-shadow:
    inset -3px -4px 5px rgba(0,0,0,.25),
    0 2px 4px rgba(0,0,0,.25);
  font-size:9px;
  font-weight:950;
  color:#111;
}
.rack-ball.stripe{
  background:
    linear-gradient(
      to bottom,
      var(--ball-color) 0 30%,
      #f4f4f4 30% 70%,
      var(--ball-color) 70% 100%
    );
}
.rack-ball.solid{
  background:var(--ball-color);
}
.rack-ball span{
  width:14px;
  height:14px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-size:7px;
  font-weight:950;
  border:1px solid rgba(0,0,0,.25);
}
.rack-ball.selected{
  outline:3px solid var(--lime);
  outline-offset:2px;
  z-index:2;
}
.rack-ball.on-table{
  opacity:.42;
}
.rack-ball.object-ball{
  opacity:1;
}
.empty{
  color:#667178;
  font-size:9px;
  padding:5px 0;
}
@media(max-width:850px){
  .layout{
    grid-template-columns:1fr;
  }
}
@media(max-width:520px){
  body{padding:5px}
  .header{height:45px}
  .brand-name{font-size:20px}
  .section{padding:12px}
  .where-grid{gap:5px}
  .where-grid.combo{
    gap:4px;
  }
  .controls{
    grid-template-columns:repeat(2,1fr);
  }
  .rack-ball{
    width:27px;
    height:27px;
  }
  .section-action{
    min-width:58px;
    min-height:32px;
  }
  .ball-label{
    font-size:8px;
  }
  .modes{
    grid-template-columns:repeat(2,1fr);
  }
  .ball-roll-option{
    min-height:42px;
  }
}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand">
    <div class="brand-name">Shot Caller</div>
  </div>
  <button class="reset" id="reset">Reset</button>
</header>

<main class="layout">

<section class="card table-card">
  <div class="table-stage">
    <canvas id="table"></canvas>
    <button
      class="delete-overlay"
      id="deleteOverlay"
      aria-label="Delete selected ball"
      title="Delete selected ball"
    >×</button>
  </div>
  <div class="legend">
    <span class="legend-item legend-white">
      <span class="legend-dot"></span>
      <span>Cue-ball path</span>
    </span>
    <span class="legend-item legend-green">
      <span class="legend-dot"></span>
      <span>Object-ball path</span>
    </span>
    <span class="legend-item legend-red">
      <span class="legend-dot"></span>
      <span>Bank / rail path</span>
    </span>
  </div>
</section>

<aside class="side">

<section class="card full-card section">
  <div class="section-head">
    <div class="section-title">
      Contact Point
    </div>
    <div class="section-accent">
      Ball <span id="whereBall">—</span>
    </div>
  </div>

  <div class="where-grid" id="whereGrid">
    <div class="ball-panel">
      <div class="ball-head">
        <div class="ball-label" id="cueViewLabel">
          Cue Ball
        </div>
      </div>
      <canvas
        class="ball-view"
        id="cueView"
      ></canvas>
    </div>

    <div class="ball-panel">
      <div class="ball-head">
        <div class="ball-label" id="objectViewLabel">
          Object Ball
        </div>
      </div>
      <canvas
        class="ball-view"
        id="objectView"
      ></canvas>
    </div>

    <div class="ball-panel combo-only">
      <div class="ball-head">
        <div class="ball-label" id="targetViewLabel">
          COMBO TARGET
        </div>
      </div>
      <canvas
        class="ball-view"
        id="targetView"
      ></canvas>
    </div>
  </div>

  <div class="controls">
    <div class="stat">
      <div class="stat-label">Type</div>
      <div class="stat-value" id="shotType">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Pocket</div>
      <div class="stat-value" id="shotPocket">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Rail</div>
      <div class="stat-value" id="shotRail">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Speed</div>
      <div class="stat-value" id="shotSpeed">—</div>
    </div>
  </div>

  <div
    class="pro-instruction"
    id="instruction"
  >
    Place the cue ball and target ball.
  </div>
</section>

<section class="card full-card section">
  <div class="section-head">
    <div class="section-title">
      Pocket
    </div>
    <button
      class="section-action active"
      id="pocketAuto"
    >
      Suggested
    </button>
  </div>

  <div
    class="pockets"
    id="pockets"
  ></div>
</section>

<section class="card full-card section">
  <div class="section-head">
    <div class="section-title">
      Shot Type
    </div>
    <button
      class="section-action active"
      id="shotAuto"
    >
      Suggested
    </button>
  </div>

  <div class="modes">
    <button
      class="mode"
      data-mode="straight"
    >
      Straight
    </button>
    <button
      class="mode"
      data-mode="cut"
    >
      Cut
    </button>
    <button
      class="mode"
      data-mode="bank"
    >
      Bank
    </button>
    <button
      class="mode"
      data-mode="kick"
    >
      Kick
    </button>
  </div>
</section>

<section class="card full-card section">
  <div class="section-head">
    <div class="section-title">
      Balls In Play
    </div>
    <div
      class="section-accent"
      id="rackAccent"
    >
      Select
    </div>
  </div>

  <div
    class="rack"
    id="rack"
  ></div>
</section>

<section class="card full-card section">
  <div class="section-head">
    <div class="section-title">
      Ball Roll
    </div>
    <div
      class="section-accent"
      id="ballRollAccent"
    >
      Roll
    </div>
  </div>

  <div
    class="ball-roll-options"
    id="ballRollOptions"
  >
    <button
      type="button"
      class="ball-roll-option active"
      data-roll="roll"
      aria-pressed="true"
    >
      Roll
    </button>
    <button
      type="button"
      class="ball-roll-option"
      data-roll="stun"
      aria-pressed="false"
    >
      Stun
    </button>
    <button
      type="button"
      class="ball-roll-option"
      data-roll="draw"
      aria-pressed="false"
    >
      Draw
    </button>
  </div>
</section>

</aside>
</main>
</div>

<script>
"use strict";

/* ============================================================
   PHYSICAL TABLE
   ============================================================ */
const TABLE_W=100;
const TABLE_H=50;
const BALL_DIAMETER=2.25;
const BALL_RADIUS=BALL_DIAMETER/2;

const RAIL={
  top:BALL_RADIUS,
  bottom:TABLE_H-BALL_RADIUS,
  left:BALL_RADIUS,
  right:TABLE_W-BALL_RADIUS
};

const POCKET_SIZE=4.55;

const POCKETS=[
  {
    id:"TL",
    name:"Top Left Corner Pocket",
    x:0,
    y:0,
    type:"corner",
    opening:POCKET_SIZE
  },
  {
    id:"TM",
    name:"Top Side Pocket",
    x:50,
    y:0,
    type:"side",
    opening:POCKET_SIZE
  },
  {
    id:"TR",
    name:"Top Right Corner Pocket",
    x:100,
    y:0,
    type:"corner",
    opening:POCKET_SIZE
  },
  {
    id:"BL",
    name:"Bottom Left Corner Pocket",
    x:0,
    y:50,
    type:"corner",
    opening:POCKET_SIZE
  },
  {
    id:"BM",
    name:"Bottom Side Pocket",
    x:50,
    y:50,
    type:"side",
    opening:POCKET_SIZE
  },
  {
    id:"BR",
    name:"Bottom Right Corner Pocket",
    x:100,
    y:50,
    type:"corner",
    opening:POCKET_SIZE
  }
];

/* ============================================================
   BALL SET
   ============================================================ */
const BALLS=[
  {n:1,type:"solid",color:"#f4c51d"},
  {n:2,type:"solid",color:"#2867c7"},
  {n:3,type:"solid",color:"#d9343e"},
  {n:4,type:"solid",color:"#6d3c9b"},
  {n:5,type:"solid",color:"#ed701c"},
  {n:6,type:"solid",color:"#16884e"},
  {n:7,type:"solid",color:"#8e1725"},
  {n:8,type:"solid",color:"#151515"},
  {n:9,type:"stripe",color:"#f4c51d"},
  {n:10,type:"stripe",color:"#2867c7"},
  {n:11,type:"stripe",color:"#d9343e"},
  {n:12,type:"stripe",color:"#6d3c9b"},
  {n:13,type:"stripe",color:"#ed701c"},
  {n:14,type:"stripe",color:"#16884e"},
  {n:15,type:"stripe",color:"#8e1725"}
];

const BALL_MAP=Object.fromEntries(
  BALLS.map(b=>[b.n,b])
);

/* ============================================================
   STATE
   ============================================================ */
const state={
  cue:{
    x:22,
    y:34
  },

  object:{
    x:65,
    y:20,
    number:3
  },

  tableBalls:[
    {
      number:3,
      x:65,
      y:20,
      role:"object",
      owner:"target"
    }
  ],

  selectedBall:null,
  selectedRackBall:3,
  selectedPocket:null,
  mode:"auto",

  ballRoll:"roll",

  solution:null,
  contactBall:null
};

/* ============================================================
   DOM
   ============================================================ */
const canvas=
  document.getElementById("table");

const ctx=
  canvas.getContext("2d");

const deleteOverlay=
  document.getElementById(
    "deleteOverlay"
  );

let DPR=Math.min(
  window.devicePixelRatio||1,
  2
);

/* ============================================================
   VECTOR MATH
   ============================================================ */
function V(x,y){
  return{x,y};
}

function add(a,b){
  return V(
    a.x+b.x,
    a.y+b.y
  );
}

function sub(a,b){
  return V(
    a.x-b.x,
    a.y-b.y
  );
}

function mul(a,n){
  return V(
    a.x*n,
    a.y*n
  );
}

function dot(a,b){
  return a.x*b.x+a.y*b.y;
}

function len(a){
  return Math.hypot(
    a.x,
    a.y
  );
}

function norm(a){
  const l=len(a);

  if(l<1e-10)
    return V(0,0);

  return V(
    a.x/l,
    a.y/l
  );
}

function dist(a,b){
  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function clamp(n,a,b){
  return Math.max(
    a,
    Math.min(b,n)
  );
}

/* ============================================================
   GEOMETRY
   ============================================================ */
function centerInside(p){
  return(
    p.x>=BALL_RADIUS &&
    p.x<=TABLE_W-BALL_RADIUS &&
    p.y>=BALL_RADIUS &&
    p.y<=TABLE_H-BALL_RADIUS
  );
}

function pointSegmentDistance(
  p,
  a,
  b
){
  const ab=sub(b,a);
  const d=dot(
    ab,
    ab
  );

  if(d<1e-10)
    return dist(p,a);

  const t=clamp(
    dot(
      sub(p,a),
      ab
    )/d,
    0,
    1
  );

  return dist(
    p,
    add(
      a,
      mul(ab,t)
    )
  );
}

/* ============================================================
   PATH CHECKING
   ============================================================ */
function pathClear(
  a,
  b,
  ignoreNumbers=[]
){
  if(!Array.isArray(ignoreNumbers))
    ignoreNumbers=[ignoreNumbers];

  for(
    const ball of state.tableBalls
  ){
    if(
      ignoreNumbers.includes(
        ball.number
      )
    ){
      continue;
    }

    if(
      pointSegmentDistance(
        ball,
        a,
        b
      )<
      BALL_DIAMETER*1.02
    ){
      return false;
    }
  }

  return true;
}

function objectPathClear(
  a,
  b,
  ignoreNumbers=[]
){
  return pathClear(
    a,
    b,
    ignoreNumbers
  );
}

/* ============================================================
   POCKET TARGETS
   ============================================================ */
function pocketTargets(pocket){
  const targets=[];

  if(
    pocket.type==="side"
  ){
    [-1.1,-.55,0,.55,1.1]
      .forEach(offset=>{
        targets.push(
          V(
            clamp(
              pocket.x+offset,
              BALL_RADIUS,
              TABLE_W-BALL_RADIUS
            ),
            pocket.y===0
              ?RAIL.top
              :RAIL.bottom
          )
        );
      });
  }else{
    const sx=
      pocket.x===0
        ?1
        :-1;

    const sy=
      pocket.y===0
        ?1
        :-1;

    [
      [.35,.35],
      [.60,.60],
      [.85,.85]
    ].forEach(([x,y])=>{
      targets.push(
        V(
          pocket.x+
            sx*x*
            POCKET_SIZE*.48,
          pocket.y+
            sy*y*
            POCKET_SIZE*.48
        )
      );
    });
  }

  return targets;
}

/* ============================================================
   GHOST BALL
   ============================================================ */
function ghostForDirection(
  object,
  direction
){
  return sub(
    object,
    mul(
      norm(direction),
      BALL_DIAMETER
    )
  );
}

/* ============================================================
   DIRECT CUT / STRAIGHT SHOT
   ============================================================ */
function directCandidate(
  cue,
  object,
  pocket,
  target
){
  const objectVector=
    sub(
      target,
      object
    );

  if(
    len(objectVector)<.01
  ){
    return null;
  }

  const objectDirection=
    norm(objectVector);

  const ghost=
    ghostForDirection(
      object,
      objectDirection
    );

  if(
    !centerInside(ghost)
  ){
    return null;
  }

  if(
    !pathClear(
      cue,
      ghost,
      [state.object.number]
    )
  ){
    return null;
  }

  if(
    !objectPathClear(
      object,
      target,
      [state.object.number]
    )
  ){
    return null;
  }

  const cueDirection=
    norm(
      sub(
        ghost,
        cue
      )
    );

  const incoming=
    norm(
      sub(
        object,
        ghost
      )
    );

  const cutAngle=
    Math.acos(
      clamp(
        dot(
          cueDirection,
          incoming
        ),
        -1,
        1
      )
    );

  const cutDegrees=
    cutAngle*180/Math.PI;

  const thinPenalty=
    cutDegrees>50
      ?(cutDegrees-50)*2.5
      :0;

  const cueDistance=
    dist(
      cue,
      ghost
    );

  const objectDistance=
    dist(
      object,
      target
    );

  const isStraight=
    cutDegrees<8;

  return{
    kind:isStraight
      ?"straight"
      :"cut",
    pocket,
    target,
    rail:null,
    ghost,
    bankPoint:null,
    cueDirection,
    objectDirection,
    cueDistance,
    objectDistance,
    cutDegrees,
    score:
      cueDistance+
      objectDistance+
      thinPenalty
  };
}

/* ============================================================
   COMBINATION SHOT
   ============================================================ */
function combinationCandidate(
  cue,
  firstBall,
  secondBall,
  pocket,
  pocketTarget
){
  if(
    !firstBall||
    !secondBall||
    firstBall.number===
    secondBall.number
  ){
    return null;
  }

  const secondToPocket=
    norm(
      sub(
        pocketTarget,
        secondBall
      )
    );

  if(
    len(secondToPocket)<.01
  ){
    return null;
  }

  const secondBallContactPoint=
    sub(
      secondBall,
      mul(
        secondToPocket,
        BALL_DIAMETER
      )
    );

  if(
    !centerInside(
      secondBallContactPoint
    )
  ){
    return null;
  }

  const firstToSecond=
    norm(
      sub(
        secondBallContactPoint,
        firstBall
      )
    );

  if(
    len(firstToSecond)<.01
  ){
    return null;
  }

  const cueGhost=
    ghostForDirection(
      firstBall,
      firstToSecond
    );

  if(
    !centerInside(cueGhost)
  ){
    return null;
  }

  if(
    !pathClear(
      cue,
      cueGhost,
      [
        firstBall.number,
        secondBall.number
      ]
    )
  ){
    return null;
  }

  if(
    !pathClear(
      firstBall,
      secondBallContactPoint,
      [
        firstBall.number,
        secondBall.number
      ]
    )
  ){
    return null;
  }

  if(
    !pathClear(
      secondBall,
      pocketTarget,
      [
        firstBall.number,
        secondBall.number
      ]
    )
  ){
    return null;
  }

  const cueDirection=
    norm(
      sub(
        cueGhost,
        cue
      )
    );

  const firstIncoming=
    norm(
      sub(
        firstBall,
        cueGhost
      )
    );

  const firstOutgoing=
    norm(
      sub(
        secondBallContactPoint,
        firstBall
      )
    );

  const transferAngle=
    Math.acos(
      clamp(
        dot(
          firstIncoming,
          firstOutgoing
        ),
        -1,
        1
      )
    )*180/Math.PI;

  if(
    transferAngle>62
  ){
    return null;
  }

  const cueDistance=
    dist(
      cue,
      cueGhost
    );

  const firstDistance=
    dist(
      firstBall,
      secondBallContactPoint
    );

  const secondDistance=
    dist(
      secondBall,
      pocketTarget
    );

  const score=
    cueDistance+
    firstDistance+
    secondDistance+
    30+
    Math.max(
      0,
      transferAngle-35
    )*2;

  return{
    kind:"combination",
    pocket,
    target:pocketTarget,
    combinationBall:firstBall,
    targetBall:secondBall,
    firstContactPoint:cueGhost,
    secondContactPoint:
      secondBallContactPoint,
    contactBall:firstBall,
    ghost:cueGhost,
    combinationGhost:
      secondBallContactPoint,
    rail:null,
    bankPoint:null,
    cueDirection,
    objectDirection:firstOutgoing,
    cueDistance,
    objectDistance:
      firstDistance+
      secondDistance,
    combinationDistance:
      firstDistance,
    targetDistance:
      secondDistance,
    transferAngle,
    cutDegrees:0,
    score
  };
}

/* ============================================================
   RAIL REFLECTION
   ============================================================ */
function reflectAcrossRail(
  p,
  rail
){
  if(
    rail==="top"
  ){
    return V(
      p.x,
      2*RAIL.top-p.y
    );
  }

  if(
    rail==="bottom"
  ){
    return V(
      p.x,
      2*RAIL.bottom-p.y
    );
  }

  if(
    rail==="left"
  ){
    return V(
      2*RAIL.left-p.x,
      p.y
    );
  }

  if(
    rail==="right"
  ){
    return V(
      2*RAIL.right-p.x,
      p.y
    );
  }

  return null;
}

function railIntersection(
  a,
  b,
  rail
){
  const dx=
    b.x-a.x;

  const dy=
    b.y-a.y;

  let t;

  if(
    rail==="top"||
    rail==="bottom"
  ){
    const y=
      rail==="top"
        ?RAIL.top
        :RAIL.bottom;

    if(
      Math.abs(dy)<1e-10
    ){
      return null;
    }

    t=
      (y-a.y)/dy;
  }else{
    const x=
      rail==="left"
        ?RAIL.left
        :RAIL.right;

    if(
      Math.abs(dx)<1e-10
    ){
      return null;
    }

    t=
      (x-a.x)/dx;
  }

  if(
    t<=.00001||
    t>=.99999
  ){
    return null;
  }

  return V(
    a.x+dx*t,
    a.y+dy*t
  );
}

function usableRailPoint(
  p,
  rail
){
  const margin=1.5;

  if(
    rail==="top"||
    rail==="bottom"
  ){
    return(
      p.x>
        BALL_RADIUS+margin&&
      p.x<
        TABLE_W-BALL_RADIUS-margin
    );
  }

  return(
    p.y>
      BALL_RADIUS+margin&&
    p.y<
      TABLE_H-BALL_RADIUS-margin
  );
}

/* ============================================================
   ONE-RAIL BANK
   ============================================================ */
function bankCandidate(
  cue,
  object,
  pocket,
  target,
  rail
){
  if(
    rail==="top"&&
    pocket.y===0
  )return null;

  if(
    rail==="bottom"&&
    pocket.y===TABLE_H
  )return null;

  if(
    rail==="left"&&
    pocket.x===0
  )return null;

  if(
    rail==="right"&&
    pocket.x===TABLE_W
  )return null;

  const reflected=
    reflectAcrossRail(
      target,
      rail
    );

  if(!reflected)
    return null;

  const bankPoint=
    railIntersection(
      object,
      reflected,
      rail
    );

  if(
    !bankPoint||
    !usableRailPoint(
      bankPoint,
      rail
    )
  ){
    return null;
  }

  if(
    !objectPathClear(
      object,
      bankPoint,
      [state.object.number]
    )
  ){
    return null;
  }

  if(
    !objectPathClear(
      bankPoint,
      target,
      [state.object.number]
    )
  ){
    return null;
  }

  const objectDirection=
    norm(
      sub(
        bankPoint,
        object
      )
    );

  const ghost=
    ghostForDirection(
      object,
      objectDirection
    );

  if(
    !centerInside(ghost)
  ){
    return null;
  }

  if(
    !pathClear(
      cue,
      ghost,
      [state.object.number]
    )
  ){
    return null;
  }

  const cueDirection=
    norm(
      sub(
        ghost,
        cue
      )
    );

  const incoming=
    norm(
      sub(
        object,
        ghost
      )
    );

  const cutAngle=
    Math.acos(
      clamp(
        dot(
          cueDirection,
          incoming
        ),
        -1,
        1
      )
    );

  const cutDegrees=
    cutAngle*180/Math.PI;

  if(
    cutDegrees>58
  ){
    return null;
  }

  const cueDistance=
    dist(
      cue,
      ghost
    );

  const firstLeg=
    dist(
      object,
      bankPoint
    );

  const secondLeg=
    dist(
      bankPoint,
      target
    );

  return{
    kind:"bank",
    pocket,
    target,
    rail,
    ghost,
    bankPoint,
    cueDirection,
    objectDirection,
    cueDistance,
    objectDistance:
      firstLeg+secondLeg,
    bankDistance:firstLeg,
    postBankDistance:
      secondLeg,
    cutDegrees,
    score:
      cueDistance+
      firstLeg+
      secondLeg+
      18+
      Math.max(
        0,
        cutDegrees-45
      )*1.4
  };
}

/* ============================================================
   KICK
   ============================================================ */
function kickCandidate(
  cue,
  object,
  pocket,
  rail
){
  const objectDirection=
    norm(
      sub(
        pocket,
        object
      )
    );

  if(
    len(objectDirection)<.01
  ){
    return null;
  }

  const ghost=
    ghostForDirection(
      object,
      objectDirection
    );

  if(
    !centerInside(ghost)
  ){
    return null;
  }

  const reflected=
    reflectAcrossRail(
      ghost,
      rail
    );

  if(!reflected)
    return null;

  const kickPoint=
    railIntersection(
      cue,
      reflected,
      rail
    );

  if(
    !kickPoint||
    !usableRailPoint(
      kickPoint,
      rail
    )
  ){
    return null;
  }

  if(
    !pathClear(
      cue,
      kickPoint,
      [state.object.number]
    )
  ){
    return null;
  }

  if(
    !pathClear(
      kickPoint,
      ghost,
      [state.object.number]
    )
  ){
    return null;
  }

  const cueDistance=
    dist(
      cue,
      kickPoint
    );

  const secondDistance=
    dist(
      kickPoint,
      ghost
    );

  const objectDistance=
    dist(
      object,
      pocket
    );

  return{
    kind:"kick",
    pocket,
    target:pocket,
    rail,
    ghost,
    bankPoint:kickPoint,
    cueDirection:
      norm(
        sub(
          kickPoint,
          cue
        )
      ),
    objectDirection,
    cueDistance,
    objectDistance,
    kickDistance:
      cueDistance,
    postKickDistance:
      secondDistance,
    cutDegrees:0,
    score:
      cueDistance+
      secondDistance+
      objectDistance+
      25
  };
}

/* ============================================================
   SOLVER
   ============================================================ */
function candidatesForPocket(
  pocket
){
  const cuts=[];
  const banks=[];
  const kicks=[];
  const combinations=[];
  const straights=[];

  const targets=
    pocketTargets(pocket);

  if(
    state.mode==="auto"||
    state.mode==="cut"||
    state.mode==="straight"
  ){
    for(
      const target of targets
    ){
      const candidate=
        directCandidate(
          state.cue,
          state.object,
          pocket,
          target
        );

      if(candidate){
        if(
          candidate.kind==="straight"
        ){
          straights.push(candidate);
        }else{
          cuts.push(candidate);
        }
      }
    }
  }

  if(
    state.mode==="auto"||
    state.mode==="cut"
  ){
    const comboBalls=
      state.tableBalls.filter(
        ball=>
          ball.role==="blocker"&&
          ball.owner==="my"&&
          ball.number!==
          state.object.number
      );

    for(
      const combinationBall
        of comboBalls
    ){
      for(
        const target of targets
      ){
        const candidate=
          combinationCandidate(
            state.cue,
            combinationBall,
            state.object,
            pocket,
            target
          );

        if(candidate)
          combinations.push(
            candidate
          );
      }
    }
  }

  if(
    state.mode==="auto"||
    state.mode==="bank"
  ){
    for(
      const target of targets
    ){
      for(
        const rail of [
          "top",
          "bottom",
          "left",
          "right"
        ]
      ){
        const candidate=
          bankCandidate(
            state.cue,
            state.object,
            pocket,
            target,
            rail
          );

        if(candidate)
          banks.push(candidate);
      }
    }
  }

  if(
    state.mode==="auto"||
    state.mode==="kick"
  ){
    for(
      const rail of [
        "top",
        "bottom",
        "left",
        "right"
      ]
    ){
      const candidate=
        kickCandidate(
          state.cue,
          state.object,
          pocket,
          rail
        );

      if(candidate)
        kicks.push(candidate);
    }
  }

  if(
    state.mode==="auto"
  ){
    if(straights.length)
      return straights.sort(
        (a,b)=>
          a.score-b.score
      );

    if(cuts.length)
      return cuts.sort(
        (a,b)=>
          a.score-b.score
      );

    if(combinations.length)
      return combinations.sort(
        (a,b)=>
          a.score-b.score
      );

    if(banks.length)
      return banks.sort(
        (a,b)=>
          a.score-b.score
      );

    return kicks.sort(
      (a,b)=>
        a.score-b.score
    );
  }

  if(
    state.mode==="straight"
  ){
    return straights.sort(
      (a,b)=>
        a.score-b.score
    );
  }

  return[
    ...straights,
    ...cuts,
    ...combinations,
    ...banks,
    ...kicks
  ].sort(
    (a,b)=>
      a.score-b.score
  );
}

function solve(){
  let best=null;

  const pockets=
    state.selectedPocket
      ?[state.selectedPocket]
      :POCKETS;

  for(
    const pocket of pockets
  ){
    const candidates=
      candidatesForPocket(
        pocket
      );

    if(!candidates.length)
      continue;

    const candidate=
      candidates[0];

    const sidePenalty=
      pocket.type==="side"
        ?1.75
        :0;

    const adjusted={
      ...candidate,
      adjustedScore:
        candidate.score+
        sidePenalty
    };

    if(
      !best||
      adjusted.adjustedScore<
      best.adjustedScore
    ){
      best=adjusted;
    }
  }

  state.solution=best;

  state.contactBall=
    best&&best.contactBall
      ?best.contactBall
      :null;

  render();
}

/* ============================================================
   SHOT LANGUAGE
   ============================================================ */
function railText(rail){
  return{
    top:"top rail",
    bottom:"bottom rail",
    left:"left rail",
    right:"right rail"
  }[rail]||"rail";
}

function speedForShot(s){
  if(!s)
    return"—";

  if(
    s.kind==="kick"
  ){
    return s.kickDistance>42
      ?"Firm"
      :s.kickDistance>25
        ?"Medium"
        :"Soft";
  }

  if(
    s.kind==="bank"
  ){
    return s.objectDistance>55
      ?"Firm"
      :s.objectDistance>32
        ?"Medium"
        :"Soft";
  }

  if(
    s.kind==="combination"
  ){
    const total=
      s.cueDistance+
      s.objectDistance;

    return total>75
      ?"Firm"
      :total>45
        ?"Medium"
        :"Soft";
  }

  if(
    s.cutDegrees>55
  ){
    return"Medium";
  }

  if(
    s.objectDistance<18
  ){
    return"Soft";
  }

  if(
    s.objectDistance>55
  ){
    return"Firm";
  }

  return"Medium";
}

/* ============================================================
   POOL CONTACT LANGUAGE
   ============================================================ */
function contactSide(s){
  if(!s)
    return"center";

  const object=
    s.kind==="combination"
      ?s.combinationBall
      :state.object;

  const contact=
    s.kind==="combination"
      ?s.firstContactPoint
      :s.ghost;

  const v=
    norm(
      sub(
        contact,
        object
      )
    );

  const x=v.x;

  if(
    Math.abs(x)<.12
  ){
    return"center";
  }

  if(
    x<-.70
  ){
    return"left-hand side";
  }

  if(
    x>.70
  ){
    return"right-hand side";
  }

  if(x<0)
    return"left side";

  return"right side";
}

/* ============================================================
   BALL ROLL / CUE-BALL ACTION
   ============================================================ */
function spinForShot(s){
  if(
    state.ballRoll==="draw"
  ){
    return{
      name:"bottom spin",
      shortName:"draw",
      cls:"spin"
    };
  }

  if(
    state.ballRoll==="stun"
  ){
    return{
      name:"stun",
      shortName:"stun",
      cls:"spin"
    };
  }

  if(
    state.ballRoll==="roll"
  ){
    return{
      name:"top spin",
      shortName:"roll",
      cls:"spin"
    };
  }

  if(!s){
    return{
      name:"top spin",
      shortName:"roll",
      cls:"spin"
    };
  }

  if(
    s.kind==="kick"
  ){
    return{
      name:"center-ball hit",
      shortName:"center-ball hit",
      cls:"spin"
    };
  }

  const cueDirection=
    norm(
      s.cueDirection
    );

  const objectDirection=
    norm(
      s.kind==="combination"
        ?sub(
            s.secondContactPoint,
            s.combinationBall
          )
        :s.objectDirection
    );

  if(
    s.kind==="bank"
  ){
    if(
      s.objectDistance>45
    ){
      return{
        name:"top spin",
        shortName:"roll",
        cls:"spin"
      };
    }

    return{
      name:"stun",
      shortName:"stun",
      cls:"spin"
    };
  }

  if(
    s.kind==="combination"
  ){
    if(
      s.transferAngle>45
    ){
      return{
        name:"bottom spin",
        shortName:"draw",
        cls:"spin"
      };
    }

    return{
      name:"stun",
      shortName:"stun",
      cls:"spin"
    };
  }

  if(
    s.cutDegrees<8
  ){
    if(
      s.objectDistance>50
    ){
      return{
        name:"top spin",
        shortName:"roll",
        cls:"spin"
      };
    }

    return{
      name:"center-ball hit",
      shortName:"center-ball hit",
      cls:"spin"
    };
  }

  if(
    s.cutDegrees>45
  ){
    return{
      name:"bottom spin",
      shortName:"draw",
      cls:"spin"
    };
  }

  const cross=
    cueDirection.x*
      objectDirection.y-
    cueDirection.y*
      objectDirection.x;

  return{
    name:
      Math.abs(cross)<.12
        ?"center-ball hit"
        :s.objectDistance>38
          ?"top spin"
          :"stun",
    shortName:
      Math.abs(cross)<.12
        ?"center-ball hit"
        :s.objectDistance>38
          ?"roll"
          :"stun",
    cls:"spin"
  };
}

/* ============================================================
   ENGLISH
   ============================================================ */
function englishForShot(s){
  if(!s)
    return{
      name:"",
      cls:"english"
    };

  if(
    s.kind==="kick"
  ){
    return{
      name:
        s.rail==="left"||
        s.rail==="right"
          ?"a touch of running English"
          :"a touch of side",
      cls:"english"
    };
  }

  const cueDirection=
    norm(
      s.cueDirection
    );

  const objectDirection=
    norm(
      s.kind==="combination"
        ?sub(
            s.secondContactPoint,
            s.combinationBall
          )
        :s.objectDirection
    );

  const cross=
    cueDirection.x*
      objectDirection.y-
    cueDirection.y*
      objectDirection.x;

  if(
    Math.abs(cross)<.12
  ){
    return{
      name:"no English",
      cls:"english"
    };
  }

  if(
    cross>0
  ){
    return{
      name:"Right English",
      cls:"english"
    };
  }

  return{
    name:"Left English",
    cls:"english"
  };
}

/* ============================================================
   POCKET / SPEED LANGUAGE
   ============================================================ */
function pocketShortName(
  pocket
){
  if(!pocket)
    return"the pocket";

  return pocket.name
    .replace(
      " Corner Pocket",
      " corner pocket"
    )
    .replace(
      " Side Pocket",
      " side pocket"
    );
}

function speedPhrase(s){
  const speed=
    speedForShot(s);

  if(
    speed==="Soft"
  ){
    return{
      name:"soft speed",
      cls:"neutral-emphasis"
    };
  }

  if(
    speed==="Firm"
  ){
    return{
      name:"firm speed",
      cls:"neutral-emphasis"
    };
  }

  return{
    name:"medium speed",
    cls:"neutral-emphasis"
  };
}

function aimPhrase(
  s,
  number
){
  const side=
    contactSide(s);

  if(
    side==="center"
  ){
    return{
      name:
        `hit the center of the ${number}`,
      cls:"neutral-emphasis"
    };
  }

  return{
    name:
      `contact the ${side} of the ${number}`,
    cls:"neutral-emphasis"
  };
}

/* ============================================================
   RICH SHOT INSTRUCTION
   ============================================================ */
function instructionHTML(s){
  if(!s){
    return(
      "Place the cue ball and target ball."
    );
  }

  const pocket=
    pocketShortName(
      s.pocket
    );

  const spin=
    spinForShot(s);

  const english=
    englishForShot(s);

  const speed=
    speedPhrase(s);

  const pocketMarkup=
    `<span class="highlight">${pocket}</span>`;

  const englishMarkup=
    english.name
      ?`<span class="highlight">${english.name}</span>`
      :"";

  if(
    s.kind==="combination"
  ){
    const first=
      s.combinationBall.number;

    const second=
      s.targetBall.number;

    const firstAim=
      aimPhrase(
        s,
        first
      );

    const secondContact=
      directionDescription(
        norm(
          sub(
            s.secondContactPoint,
            s.targetBall
          )
        )
      );

    const rollText=
      state.ballRoll==="roll"
        ?`Use <span class="highlight">top spin</span>`
        :state.ballRoll==="stun"
          ?`Use <span class="highlight">stun</span>`
          :`Use <span class="highlight">bottom spin</span>`;

    return(
      `${rollText} with ${englishMarkup}. `+
      `${firstAim.name} to send it into the `+
      `<span class="neutral-emphasis">${second}</span>. `+
      `Contact the `+
      `<span class="neutral-emphasis">${second} on its ${secondContact}</span>`+
      ` to send it to the `+
      `${pocketMarkup}. `+
      `<span class="neutral-emphasis">${speed.name}</span>.`
    );
  }

  if(
    s.kind==="kick"
  ){
    const spinText=
      state.ballRoll==="roll"
        ?`Use <span class="highlight">top spin</span>`
        :state.ballRoll==="stun"
          ?`Use <span class="highlight">stun</span>`
          :`Use <span class="highlight">bottom spin</span>`;

    return(
      `${spinText} with ${englishMarkup}. `+
      `Kick off the `+
      `<span class="highlight">${railText(s.rail)}</span>`+
      ` and contact the `+
      `<span class="neutral-emphasis">${state.object.number} on its ${contactSide(s)}</span>`+
      ` to send it toward the `+
      `${pocketMarkup}. `+
      `<span class="neutral-emphasis">${speed.name}</span>.`
    );
  }

  if(
    s.kind==="bank"
  ){
    const aim=
      aimPhrase(
        s,
        state.object.number
      );

    const spinText=
      state.ballRoll==="roll"
        ?`Use <span class="highlight">top spin</span>`
        :state.ballRoll==="stun"
          ?`Use <span class="highlight">stun</span>`
          :`Use <span class="highlight">bottom spin</span>`;

    return(
      `${spinText} with ${englishMarkup}. `+
      `${aim.name} to bank the `+
      `<span class="neutral-emphasis">${state.object.number}</span>`+
      ` off the `+
      `<span class="highlight">${railText(s.rail)}</span>`+
      ` to the `+
      `${pocketMarkup}. `+
      `<span class="neutral-emphasis">${speed.name}</span>.`
    );
  }

  if(
    s.kind==="straight"
  ){
    const spinText=
      state.ballRoll==="roll"
        ?`Use <span class="highlight">top spin</span>`
        :state.ballRoll==="stun"
          ?`Use <span class="highlight">stun</span>`
          :`Use <span class="highlight">bottom spin</span>`;

    return(
      `${spinText} with ${englishMarkup}. `+
      `Hit the center of the cue ball and `+
      `send the `+
      `<span class="neutral-emphasis">${state.object.number}</span>`+
      ` straight toward the `+
      `${pocketMarkup}. `+
      `<span class="neutral-emphasis">${speed.name}</span>.`
    );
  }

  const aim=
    aimPhrase(
      s,
      state.object.number
    );

  const spinText=
    state.ballRoll==="roll"
      ?`Use <span class="highlight">top spin</span>`
      :state.ballRoll==="stun"
        ?`Use <span class="highlight">stun</span>`
        :`Use <span class="highlight">bottom spin</span>`;

  return(
    `${spinText} with ${englishMarkup}. `+
    `${aim.name} to cut the `+
    `<span class="neutral-emphasis">${state.object.number}</span>`+
    ` to the `+
    `${pocketMarkup}. `+
    `<span class="neutral-emphasis">${speed.name}</span>.`
  );
}

/* ============================================================
   DIRECTION DESCRIPTION
   ============================================================ */
function directionDescription(
  direction
){
  if(!direction)
    return"center";

  const x=direction.x;
  const y=direction.y;
  const threshold=.25;

  if(
    Math.abs(x)<threshold&&
    Math.abs(y)<threshold
  ){
    return"center";
  }

  if(
    Math.abs(x)>=threshold&&
    Math.abs(y)>=threshold
  ){
    if(
      x<0&&
      y<0
    ){
      return"upper-left side";
    }

    if(
      x>0&&
      y<0
    ){
      return"upper-right side";
    }

    if(
      x<0&&
      y>0
    ){
      return"lower-left side";
    }

    return"lower-right side";
  }

  if(
    Math.abs(x)>Math.abs(y)
  ){
    return x<0
      ?"left side"
      :"right side";
  }

  return y<0
    ?"top"
    :"bottom";
}

/* ============================================================
   SCREEN GEOMETRY
   ============================================================ */
function geometry(){
  const w=canvas.width;
  const h=canvas.height;

  const inset=
    Math.min(w,h)*.085;

  return{
    x:inset,
    y:inset,
    w:w-inset*2,
    h:h-inset*2
  };
}

function toScreen(p){
  const g=geometry();

  return V(
    g.x+
      p.x/TABLE_W*
      g.w,
    g.y+
      p.y/TABLE_H*
      g.h
  );
}

function fromScreen(
  clientX,
  clientY
){
  const rect=
    canvas.getBoundingClientRect();

  const g=geometry();

  const px=
    (clientX-rect.left)*
    canvas.width/
    rect.width;

  const py=
    (clientY-rect.top)*
    canvas.height/
    rect.height;

  return V(
    (px-g.x)/
      g.w*
      TABLE_W,
    (py-g.y)/
      g.h*
      TABLE_H
  );
}

/* ============================================================
   TABLE DRAWING
   ============================================================ */
function roundedRect(
  c,
  x,
  y,
  w,
  h,
  r
){
  c.beginPath();

  c.moveTo(
    x+r,
    y
  );

  c.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    r
  );

  c.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    r
  );

  c.arcTo(
    x,
    y+h,
    x,
    y,
    r
  );

  c.arcTo(
    x,
    y,
    x+w,
    y,
    r
  );

  c.closePath();
}

function drawTable(){
  const w=canvas.width;
  const h=canvas.height;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  const g=geometry();

  const wood=
    ctx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  wood.addColorStop(
    0,
    "#624326"
  );

  wood.addColorStop(
    .5,
    "#2e1d11"
  );

  wood.addColorStop(
    1,
    "#4b2e18"
  );

  ctx.fillStyle=wood;

  roundedRect(
    ctx,
    0,
    0,
    w,
    h,
    Math.min(w,h)*.035
  );

  ctx.fill();

  const felt=
    ctx.createLinearGradient(
      0,
      g.y,
      0,
      g.y+g.h
    );

  felt.addColorStop(
    0,
    "#197755"
  );

  felt.addColorStop(
    .5,
    "#146447"
  );

  felt.addColorStop(
    1,
    "#10533a"
  );

  ctx.fillStyle=felt;

  ctx.fillRect(
    g.x,
    g.y,
    g.w,
    g.h
  );

  ctx.strokeStyle=
    "rgba(7,6,4,.95)";

  ctx.lineWidth=
    Math.max(
      2,
      Math.min(w,h)*.018
    );

  ctx.strokeRect(
    g.x,
    g.y,
    g.w,
    g.h
  );

  drawDiamonds(g);
  drawPockets(g);
}

function drawDiamonds(g){
  const size=Math.max(
    2.5,
    Math.min(
      g.w,
      g.h
    )*.017
  );

  function diamond(
    x,
    y
  ){
    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.rotate(
      Math.PI/4
    );

    ctx.fillStyle=
      "rgba(240,214,168,.72)";

    ctx.fillRect(
      -size/2,
      -size/2,
      size,
      size
    );

    ctx.restore();
  }

  [
    .125,
    .25,
    .375,
    .5,
    .625,
    .75,
    .875
  ].forEach(t=>{
    diamond(
      g.x+g.w*t,
      g.y-size*.72
    );

    diamond(
      g.x+g.w*t,
      g.y+g.h+size*.72
    );
  });

  [
    .25,
    .5,
    .75
  ].forEach(t=>{
    diamond(
      g.x-size*.72,
      g.y+g.h*t
    );

    diamond(
      g.x+g.w+size*.72,
      g.y+g.h*t
    );
  });
}

/* ============================================================
   POCKETS
   ============================================================ */
function drawPockets(g){
  const outerRadius=
    POCKET_SIZE/
    TABLE_W*
    g.w/2;

  POCKETS.forEach(
    pocket=>{
      const p=
        toScreen(pocket);

      const selected=
        state.selectedPocket&&
        state.selectedPocket.id===
        pocket.id;

      const suggested=
        state.solution&&
        state.solution.pocket.id===
        pocket.id;

      ctx.save();

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        outerRadius*1.12,
        0,
        Math.PI*2
      );

      ctx.fillStyle="#21160d";
      ctx.fill();

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        outerRadius,
        0,
        Math.PI*2
      );

      ctx.fillStyle="#020202";
      ctx.fill();

      const pocketShade=
        ctx.createRadialGradient(
          p.x-
            outerRadius*.28,
          p.y-
            outerRadius*.30,
          outerRadius*.08,
          p.x,
          p.y,
          outerRadius
        );

      pocketShade.addColorStop(
        0,
        "#090909"
      );

      pocketShade.addColorStop(
        .72,
        "#010101"
      );

      pocketShade.addColorStop(
        1,
        "#000000"
      );

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        outerRadius*.86,
        0,
        Math.PI*2
      );

      ctx.fillStyle=
        pocketShade;

      ctx.fill();

      ctx.restore();

      if(
        selected||
        suggested
      ){
        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          outerRadius*1.35,
          0,
          Math.PI*2
        );

        ctx.strokeStyle=
          selected
            ?"rgba(217,255,63,.95)"
            :"rgba(217,255,63,.55)";

        ctx.lineWidth=2;
        ctx.stroke();
      }
    }
  );
}

/* ============================================================
   ROUTES
   ============================================================ */
function drawLine(
  a,
  b,
  color,
  width,
  dashed=false
){
  const A=toScreen(a);
  const B=toScreen(b);

  ctx.beginPath();

  ctx.moveTo(
    A.x,
    A.y
  );

  ctx.lineTo(
    B.x,
    B.y
  );

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.lineCap="round";

  ctx.setLineDash(
    dashed
      ?[7,7]
      :[]
  );

  ctx.stroke();

  ctx.setLineDash([]);
}

function drawRoute(){
  const s=state.solution;

  if(!s)
    return;

  const lineWidth=
    Math.max(
      2,
      canvas.width*.0026
    );

  if(
    s.kind==="combination"
  ){
    drawLine(
      state.cue,
      s.firstContactPoint,
      "#ffffff",
      lineWidth,
      false
    );

    drawLine(
      s.combinationBall,
      s.secondContactPoint,
      "#42d995",
      lineWidth,
      true
    );

    drawLine(
      s.targetBall,
      s.target,
      "#42d995",
      lineWidth,
      true
    );

    drawComboContactPoint(
      s.firstContactPoint,
      "#ffffff"
    );

    drawComboContactPoint(
      s.secondContactPoint,
      "#42d995"
    );
  }else if(
    s.kind==="kick"
  ){
    drawLine(
      state.cue,
      s.bankPoint,
      "#ff9f43",
      lineWidth+1,
      false
    );

    drawLine(
      s.bankPoint,
      s.ghost,
      "#ff9f43",
      lineWidth+1,
      false
    );

    drawLine(
      state.object,
      s.target,
      "#42d995",
      lineWidth,
      true
    );
  }else{
    drawLine(
      state.cue,
      s.ghost,
      "#ffffff",
      lineWidth,
      false
    );
  }

  if(
    s.kind==="cut"||
    s.kind==="straight"
  ){
    drawLine(
      state.object,
      s.target,
      "#42d995",
      lineWidth,
      true
    );
  }else if(
    s.kind==="bank"
  ){
    drawLine(
      state.object,
      s.bankPoint,
      "#ff9f43",
      lineWidth+1,
      false
    );

    drawLine(
      s.bankPoint,
      s.target,
      "#ff9f43",
      lineWidth+1,
      false
    );

    drawLine(
      state.object,
      s.bankPoint,
      "#42d995",
      lineWidth,
      true
    );

    drawBankPoint(
      s.bankPoint
    );
  }else if(
    s.kind==="kick"
  ){
    drawBankPoint(
      s.bankPoint
    );
  }

  if(
    s.kind!=="combination"
  ){
    const gp=
      toScreen(s.ghost);

    const g=geometry();

    const radius=
      BALL_RADIUS/
      TABLE_W*
      g.w;

    ctx.beginPath();

    ctx.arc(
      gp.x,
      gp.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.strokeStyle=
      "rgba(217,255,63,.45)";

    ctx.lineWidth=1.5;

    ctx.setLineDash(
      [5,5]
    );

    ctx.stroke();

    ctx.setLineDash([]);
  }
}

function drawComboContactPoint(
  p,
  color
){
  if(!p)
    return;

  const q=
    toScreen(p);

  ctx.beginPath();

  ctx.arc(
    q.x,
    q.y,
    Math.max(
      4,
      canvas.width*.006
    ),
    0,
    Math.PI*2
  );

  ctx.fillStyle=color;
  ctx.fill();

  ctx.strokeStyle=
    "rgba(0,0,0,.65)";

  ctx.lineWidth=2;
  ctx.stroke();
}

function drawBankPoint(p){
  if(!p)
    return;

  const q=
    toScreen(p);

  ctx.beginPath();

  ctx.arc(
    q.x,
    q.y,
    Math.max(
      4,
      canvas.width*.006
    ),
    0,
    Math.PI*2
  );

  ctx.fillStyle="#ff9f43";

  ctx.strokeStyle=

/* ============================================================
   POOL BALLS
   ============================================================ */
function drawPoolBall(
  position,
  number,
  selected=false,
  role="obstacle"
){
  const g=geometry();

  const p=
    toScreen(position);

  const radius=
    BALL_RADIUS/
    TABLE_W*
    g.w;

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    p.x+radius*.10,
    p.y+radius*.12,
    radius*1.01,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(0,0,0,.24)";

  ctx.fill();

  ctx.restore();

  const ball=
    BALL_MAP[number];

  if(!ball)
    return;

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.clip();

  const gradient=
    ctx.createRadialGradient(
      p.x-radius*.36,
      p.y-radius*.42,
      radius*.03,
      p.x,
      p.y,
      radius
    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    .18,
    ball.color
  );

  gradient.addColorStop(
    .82,
    ball.color
  );

  gradient.addColorStop(
    1,
    "#111111"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    p.x-radius,
    p.y-radius,
    radius*2,
    radius*2
  );

  if(
    ball.type==="stripe"
  ){
    ctx.fillStyle="#f5f5f5";

    ctx.fillRect(
      p.x-radius,
      p.y-radius*.31,
      radius*2,
      radius*.62
    );
  }

  ctx.restore();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    "rgba(255,255,255,.28)";

  ctx.lineWidth=
    Math.max(
      1,
      radius*.035
    );

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius*.39,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#f8f8f8";
  ctx.fill();

  ctx.strokeStyle=
    "rgba(0,0,0,.55)";

  ctx.lineWidth=
    Math.max(
      1,
      radius*.035
    );

  ctx.stroke();

  ctx.fillStyle="#111";

  ctx.font=
    `900 ${Math.max(
      6,
      radius*.62
    )}px Arial`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    number,
    p.x,
    p.y+.25
  );

  if(
    selected||
    role==="object"
  ){
    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius*1.17,
      0,
      Math.PI*2
    );

    ctx.strokeStyle=
      selected
        ?"rgba(217,255,63,.95)"
        :"rgba(217,255,63,.48)";

    ctx.lineWidth=
      Math.max(
        1.5,
        radius*.07
      );

    ctx.stroke();
  }

  if(
    role==="blocker"
  ){
    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius*1.13,
      0,
      Math.PI*2
    );

    ctx.strokeStyle=
      "rgba(255,70,82,.55)";

    ctx.lineWidth=
      Math.max(
        1,
        radius*.045
      );

    ctx.stroke();
  }
}

function setupBallCanvas(el){

      Math.round(
        rect.width*DPR
      )
    );

        rect.height*DPR
      )
    );

  return el.getContext("2d");
}

function largeBall(
  c,
  type,
  number
){
  const w=
    c.canvas.width;

  const h=
    c.canvas.height;

  c.clearRect(
    0,
    0,
    w,
    h
  );

  const x=w/2;
  const y=h/2;

  const r=
    Math.min(
      w,
      h
    )*.36;

  if(
    type==="cue"
  ){
    const gradient=
      c.createRadialGradient(
        x-r*.36,
        y-r*.42,
        r*.02,
        x,
        y,
        r
      );

    gradient.addColorStop(
      0,
      "#ffffff"
    );

    gradient.addColorStop(
      .76,
      "#f0f0f0"
    );

    gradient.addColorStop(
      1,
      "#c2c6c8"
    );

    c.beginPath();

    c.arc(
      x,
      y,
      r,
      0,
      Math.PI*2
    );

    c.fillStyle=gradient;
    c.fill();

    c.strokeStyle=
      "rgba(0,0,0,.25)";

    c.lineWidth=
      Math.max(
        1,
        r*.025
      );

    c.stroke();

    return{
      x,
      y,
      r
    };
  }

  const ball=
    BALL_MAP[number];

  if(!ball)
    return{
      x,
      y,
      r
    };

  c.save();

  c.beginPath();

  c.arc(
    x,
    y,
    r,
    0,
    Math.PI*2
  );

  c.clip();

  c.fillStyle=
    ball.color;

  c.fillRect(
    x-r,
    y-r,
    r*2,
    r*2
  );

  if(
    ball.type==="stripe"
  ){
    c.fillStyle="#f7f7f7";

    c.fillRect(
      x-r,
      y-r*.30,
      r*2,
      r*.60
    );
  }

  const shade=
    c.createRadialGradient(
      x-r*.38,
      y-r*.40,
      r*.04,
      x,
      y,
      r
    );

  shade.addColorStop(
    0,
    "rgba(255,255,255,.34)"
  );

  shade.addColorStop(
    .32,
    "rgba(255,255,255,0)"
  );

  shade.addColorStop(
    .82,
    "rgba(0,0,0,0)"
  );

  shade.addColorStop(
    1,
    "rgba(0,0,0,.20)"
  );

  c.fillStyle=shade;

  c.fillRect(
    x-r,
    y-r,
    r*2,
    r*2
  );

  c.restore();

  c.beginPath();

  c.arc(
    x,
    y,
    r,
    0,
    Math.PI*2
  );

  c.strokeStyle=
    "rgba(0,0,0,.42)";

  c.lineWidth=
    Math.max(
      1,
      r*.025
    );

  c.stroke();

  c.beginPath();

  c.arc(
    x,
    y,
    r*.39,
    0,
    Math.PI*2
  );

  c.fillStyle="#fafafa";
  c.fill();

  c.strokeStyle=
    "rgba(0,0,0,.65)";

  c.lineWidth=
    Math.max(
      1.5,
      r*.035
    );

  c.stroke();

  c.fillStyle="#111";

  c.font=
    `900 ${Math.max(
      10,
      r*.50
    )}px Arial`;

  c.textAlign="center";
  c.textBaseline="middle";

  c.fillText(
    number,
    x,
    y+.5
  );

  return{
    x,
    y,
    r
  };
}

function drawContactMarker(
  c,
  ball,
  direction,
  markerColor="#ff4652"
){
  if(
    !ball||
    !direction
  ){
    return;
  }

  const markerDistance=
    ball.r*.76;

  const markerRadius=
    Math.max(
      5,
      ball.r*.115
    );

  const x=
    ball.x+
    direction.x*
    markerDistance;

  const y=
    ball.y+
    direction.y*
    markerDistance;

  c.beginPath();

  c.arc(
    x,
    y,
    markerRadius,
    0,
    Math.PI*2
  );

  c.fillStyle=markerColor;
  c.fill();

  c.strokeStyle=
    "rgba(0,0,0,.45)";

  c.lineWidth=
    Math.max(
      1,
      markerRadius*.18
    );

  c.stroke();
}

function drawCueView(c){
  const ball=
    largeBall(
      c,
      "cue"
    );

  const s=
    state.solution;

  if(!s)
    return;

  const direction=
    norm(
      sub(
        s.kind==="combination"
          ?s.firstContactPoint
          :s.ghost,
        state.cue
      )
    );

  drawContactMarker(
    c,
    ball,
    direction,
    "#ffffff"
  );
}

function drawObjectView(c){
  const s=
    state.solution;

  const displayedNumber=
    s&&
    s.kind==="combination"
      ?s.combinationBall.number
      :state.object.number;

  const ball=
    largeBall(
      c,
      "object",
      displayedNumber
    );

  if(!s)
    return;

  let contactObject;
  let contactPoint;

  if(
    s.kind==="combination"
  ){
    contactObject=
      s.combinationBall;

    contactPoint=
      s.firstContactPoint;
  }else{
    contactObject=
      state.object;

    contactPoint=
      s.ghost;
  }

  const contact=
    norm(
      sub(
        contactPoint,
        contactObject
      )
    );

  drawContactMarker(
    c,
    ball,
    contact,
    "#ffffff"
  );
}

function drawTargetView(c){
  const s=
    state.solution;

  if(
    !s||
    s.kind!=="combination"
  ){
    return;
  }

  const ball=
    largeBall(
      c,
      "object",
      s.targetBall.number
    );

  const contact=
    norm(
      sub(
        s.secondContactPoint,
        s.targetBall
      )
    );

  drawContactMarker(
    c,
    ball,
    contact,
    "#42d995"
  );
}

function drawBallViews(){
  const cueContext=
    setupBallCanvas(
      document.getElementById(
        "cueView"
      )
    );

  const objectContext=
    setupBallCanvas(
      document.getElementById(
        "objectView"
      )
    );

  const targetContext=
    setupBallCanvas(
      document.getElementById(
        "targetView"
      )
    );

  drawCueView(
    cueContext
  );

  drawObjectView(
    objectContext
  );

  drawTargetView(
    targetContext
  );
}

/* ============================================================
   DELETE OVERLAY
   ============================================================ */
function updateDeleteOverlay(){
  const selected=
    state.selectedBall==="cue"
      ?state.cue
      :(
        state.selectedBall==="object"&&
        state.selectedRackBall
          ?state.tableBalls.find(
              b=>
                b.number===
                state.selectedRackBall
            )
          :null
      );

  if(!selected){
    deleteOverlay.classList.remove(
      "visible"
    );

    return;
  }

  const rect=
    canvas.getBoundingClientRect();

  const p=
    toScreen(selected);

  const scaleX=
    rect.width/
    canvas.width;

  const ballRadiusPx=
    BALL_RADIUS/
    TABLE_W*
    geometry().w*
    scaleX;

  const left=
    p.x*scaleX+
    ballRadiusPx*1.75;

  const top=
    p.y*
      (rect.height/
       canvas.height)-
    ballRadiusPx*1.75;

  deleteOverlay.style.left=
    `${left}px`;

  deleteOverlay.style.top=
    `${top}px`;

  deleteOverlay.classList.add(
    "visible"
  );
}

deleteOverlay.addEventListener(
  "pointerdown",
  event=>{
    event.preventDefault();
    event.stopPropagation();
  },
  {
    passive:false
  }
);

deleteOverlay.addEventListener(
  "click",
  event=>{
    event.preventDefault();
    event.stopPropagation();
    removeSelectedBall();
  }
);

/* ============================================================
   MASTER DRAW
   ============================================================ */
function draw(){
  drawTable();
  drawRoute();
  drawBalls();
  drawBallViews();
  updateDeleteOverlay();
}

/* ============================================================
   UI RENDER
   ============================================================ */
function render(){
  const s=
    state.solution;

  document.getElementById(
    "whereBall"
  ).textContent=
    state.object.number;

  document.getElementById(
    "shotType"
  ).textContent=
    s
      ?(
        s.kind==="combination"
          ?"Combo"
          :s.kind==="straight"
            ?"Straight"
            :capitalize(s.kind)
      )
      :"—";

  document.getElementById(
    "shotPocket"
  ).textContent=
    s
      ?s.pocket.name
      :"—";

  document.getElementById(
    "shotRail"
  ).textContent=
    s&&s.rail
      ?capitalize(
          railText(s.rail)
        )
      :"—";

  document.getElementById(
    "shotSpeed"
  ).textContent=
    s
      ?speedForShot(s)
      :"—";

  document.getElementById(
    "instruction"
  ).innerHTML=
    instructionHTML(s);

  const whereGrid=
    document.getElementById(
      "whereGrid"
    );

  whereGrid.classList.toggle(
    "combo",
    !!(
      s&&
      s.kind==="combination"
    )
  );

  document.getElementById(
    "objectViewLabel"
  ).textContent=
    s&&
    s.kind==="combination"
      ?`First Contact · ${s.combinationBall.number}`
      :"Object Ball";

  document.getElementById(
    "targetViewLabel"
  ).textContent=
    s&&
    s.kind==="combination"
      ?`Second Contact · ${s.targetBall.number}`
      :"COMBO TARGET";

  renderPockets();
  renderModes();
  renderRack();
  renderBallRoll();
  draw();
}

function capitalize(text){
  if(!text)
    return text;

  return(
    text.charAt(0).toUpperCase()+
    text.slice(1)
  );
}

/* ============================================================
   POCKET UI
   ============================================================ */
document.getElementById(
  "pocketAuto"
).onclick=()=>{
  state.selectedPocket=null;
  solve();
};

    document.getElementById(
      "pockets"
    );

  ){

      document.createElement(

      solve();
    };

  document.getElementById(
    "pocketAuto"

  );

/* ============================================================
   MODE UI
   ============================================================ */
document.getElementById(
  "shotAuto"
).onclick=()=>{
  state.mode="auto";
  solve();
};

  ).forEach(

/* ============================================================
   BALL ROLL UI
   ============================================================ */
function renderBallRoll(){
  const labels={
    roll:"Roll",
    stun:"Stun",
    draw:"Draw"
  };

  document.querySelectorAll(
    ".ball-roll-option"
  ).forEach(
    button=>{
      const active=
        state.ballRoll===
        button.dataset.roll;

      button.classList.toggle(
        "active",
        active
      );

      button.setAttribute(
        "aria-pressed",

          :"false"
      );
    }

    "ballRollAccent"
  ).textContent=

    "Roll";
}

document.querySelectorAll(
  ".ball-roll-option"
).forEach(
  button=>{
    button.addEventListener(
      "pointerdown",
      event=>{
        event.preventDefault();
      },
      {
        passive:false
      }
    );

    button.addEventListener(
      "click",
      event=>{
        event.preventDefault();
        event.stopPropagation();

        const roll=
          button.dataset.roll;

        if(
          ![
            "roll",
            "stun",
            "draw"
          ].includes(roll)
        ){
          return;
        }

        state.ballRoll=roll;

        render();
      }
    );
  }
);

/* ============================================================
   RACK
   ============================================================ */
function rackOrder(){
  return[
    [1],
    [2,3],
    [4,8,5],
    [6,7,9,10],
    [11,12,13,14,15]
  ];
}

function renderRack(){
  const rack=
    document.getElementById(
      "rack"
    );

  rack.innerHTML="";

  const placed=
    new Set(
      state.tableBalls.map(
        b=>b.number
      )
    );

  rackOrder().forEach(
    (numbers,index)=>{
      const row=
        document.createElement(
          "div"
        );

      row.className=
        `rack-row r${index+1}`;

      numbers.forEach(
        number=>{
          const ball=
            BALL_MAP[number];

          const button=
            document.createElement(
              "button"
            );

          button.className=
            `rack-ball ${ball.type}`;

          button.style.setProperty(
            "--ball-color",
            ball.color
          );

          if(
            state.selectedRackBall===
            number
          ){
            button.classList.add(
              "selected"
            );
          }

          if(
            placed.has(number)
          ){
            button.classList.add(
              "on-table"
            );
          }

          if(
            state.object.number===
            number&&
            state.tableBalls.some(
              b=>
                b.number===
                number&&
                b.role==="object"
            )
          ){
            button.classList.add(
              "object-ball"
            );
          }

          const span=
            document.createElement(
              "span"
            );

          span.textContent=
            number;

          button.appendChild(
            span
          );

          button.onclick=event=>{
            event.stopPropagation();

            selectRackBall(
              number
            );
          };

          row.appendChild(
            button
          );
        }
      );

      rack.appendChild(
        row
      );
    }
  );

  document.getElementById(
    "rackAccent"
  ).textContent=
    state.selectedRackBall
      ?`Ball ${state.selectedRackBall} Selected`
      :"Select";
}

/* ============================================================
   RACK SELECTION
   ============================================================ */
function selectRackBall(
  number
){
  state.selectedRackBall=
    number;

  state.selectedBall=
    "object";

  const existing=
    state.tableBalls.find(
      b=>
        b.number===
        number
    );

  if(existing){
    if(
      existing.role==="object"
    ){
      state.object={
        x:existing.x,
        y:existing.y,
        number
      };
    }
  }

  solve();
}

/* ============================================================
   HIT TEST
   ============================================================ */
function nearestBall(p){
  const touchRadius=
    Math.max(
      BALL_DIAMETER*1.7,
      4.4
    );

  if(
    dist(
      p,
      state.cue
    )<=touchRadius
  ){
    return{
      type:"cue"
    };
  }

  let best=null;
  let bestDistance=Infinity;

  for(
    const ball of
    state.tableBalls
  ){
    const d=
      dist(
        p,
        ball
      );

    if(
      d<=touchRadius&&
      d<bestDistance
    ){
      best=ball;
      bestDistance=d;
    }
  }

  if(best){
    return{
      type:"object",
      number:best.number,
      role:best.role
    };
  }

  return null;
}

/* ============================================================
   VALID POSITION
   ============================================================ */
function validBallPosition(
  p,
  movingNumber=null
){
  if(
    !centerInside(p)
  ){
    return false;
  }

  if(
    dist(
      p,
      state.cue
    )<BALL_DIAMETER
  ){
    return false;
  }

  for(
    const ball of
    state.tableBalls
  ){
    if(
      ball.number===
      movingNumber
    ){
      continue;
    }

    if(
      dist(
        p,
        ball
      )<BALL_DIAMETER
    ){
      return false;
    }
  }

  return true;
}

/* ============================================================
   TABLE INTERACTION
   ============================================================ */
canvas.addEventListener(
  "pointerdown",
  event=>{
    event.preventDefault();

    const p=
      fromScreen(
        event.clientX,
        event.clientY
      );

    const hit=
      nearestBall(p);

    if(hit){
      if(
        hit.type==="cue"
      ){
        state.selectedBall=
          "cue";

        state.selectedRackBall=
          null;

        render();

        return;
      }

      const ball=
        state.tableBalls.find(
          b=>
            b.number===
            hit.number
        );

      if(!ball)
        return;

      state.selectedBall=
        "object";

      state.selectedRackBall=
        ball.number;

      if(
        ball.role==="object"
      ){
        state.object={
          x:ball.x,
          y:ball.y,
          number:ball.number
        };
      }

      render();

      return;
    }

    if(
      !state.selectedBall
    ){
      return;
    }

    const next=V(
      clamp(
        p.x,
        BALL_RADIUS,
        TABLE_W-BALL_RADIUS
      ),
      clamp(
        p.y,
        BALL_RADIUS,
        TABLE_H-BALL_RADIUS
      )
    );

    if(
      state.selectedBall===
      "cue"
    ){
      if(
        !validBallPosition(next)
      ){
        return;
      }

      state.cue=next;

      solve();

      return;
    }

    const number=
      state.selectedRackBall;

    if(!number)
      return;

    const existing=
      state.tableBalls.find(
        b=>
          b.number===
          number
      );

    if(existing){
      if(
        !validBallPosition(
          next,
          number
        )
      ){
        return;
      }

      existing.x=
        next.x;

      existing.y=
        next.y;

      if(
        existing.role==="object"
      ){
        state.object={
          x:next.x,
          y:next.y,
          number
        };
      }
    }else{
      if(
        !validBallPosition(next)
      ){
        return;
      }

      const hasTarget=
        state.tableBalls.some(
          b=>
            b.role==="object"
        );

      const newBall={
        number,
        x:next.x,
        y:next.y,
        role:
          hasTarget
            ?"blocker"
            :"object",
        owner:
          hasTarget
            ?"my"
            :"target"
      };

      state.tableBalls.push(
        newBall
      );

      if(
        newBall.role==="object"
      ){
        state.object={
          x:next.x,
          y:next.y,
          number
        };
      }
    }

    solve();
  },
  {
    passive:false
  }
);

/* ============================================================
   REMOVE BALL
   ============================================================ */
function removeSelectedBall(){
  if(
    !state.selectedRackBall
  ){
    return;
  }

  const number=
    state.selectedRackBall;

  const removed=
    state.tableBalls.find(
      b=>
        b.number===
        number
    );

  state.tableBalls=
    state.tableBalls.filter(
      b=>
        b.number!==
        number
    );

  state.selectedRackBall=
    null;

  state.selectedBall=
    null;

  if(
    removed&&
    removed.role==="object"
  ){
    const replacement=
      state.tableBalls[0];

    if(replacement){
      replacement.role=
        "object";

      replacement.owner=
        "target";

      state.object={
        x:replacement.x,
        y:replacement.y,
        number:
          replacement.number
      };
    }else{
      state.object={
        x:65,
        y:20,
        number:3
      };
    }
  }

  solve();
}

/* ============================================================
   RESET
   ============================================================ */
document.getElementById(
  "reset"
).onclick=()=>{
  state.cue={
    x:22,
    y:34
  };

  state.object={
    x:65,
    y:20,
    number:3
  };

  state.tableBalls=[
    {
      number:3,
      x:65,
      y:20,
      role:"object",
      owner:"target"
    }
  ];

  state.selectedBall=
    null;

  state.selectedRackBall=
    3;

  state.selectedPocket=
    null;

  state.mode=
    "auto";

  state.ballRoll=
    "roll";

  state.solution=
    null;

  state.contactBall=
    null;

  solve();
};

/* ============================================================
   RESIZE
   ============================================================ */
let resizeTimer=null;

window.addEventListener(
  "resize",
  ()=>{
    clearTimeout(
      resizeTimer
    );

    resizeTimer=
      setTimeout(
        ()=>{
          DPR=Math.min(
            window.devicePixelRatio||1,
            2
          );

          resizeCanvas();
        },
        50
      );
  }
);

function resizeCanvas(){
  const rect=
    canvas.getBoundingClientRect();

  canvas.width=
    Math.max(
      1,
      Math.round(
        rect.width*DPR
      )
    );

  canvas.height=
    Math.max(
      1,
      Math.round(
        rect.height*DPR
      )
    );

  draw();
}

/* ============================================================
   START
   ============================================================ */
requestAnimationFrame(
  ()=>{
    state.tableBalls=[
      {
        number:3,
        x:65,
        y:20,
        role:"object",
        owner:"target"
      }
    ];

    state.selectedRackBall=
      3;

    state.ballRoll=
      "roll";

    resizeCanvas();

    solve();
  }
);
